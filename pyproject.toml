[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-browser"
version = "0.1.0"
description = "Browsable photo archive frontend for static directory listings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0,<4.0",
  "httpx>=0.28,<1.0",
]

[project.scripts]
photo-browser = "photo_browser.__main__:main"

[tool.setuptools]
packages = ["photo_browser"]

[tool.setuptools.package-data]
photo_browser = ["templates/*.html", "static/*.css"]
